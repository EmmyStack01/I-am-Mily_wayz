    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
    <script>
         // Use window.onload to make sure everything is ready
        VANTA.FOG({
            el: "#vanta-canvas",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            // Adjusted for visible movement:
            highlightColor: 0x222222,  // Lifted slightly from #111111 to see the motion
            midtoneColor: 0x111111,    // Your card-bg color
            lowlightColor: 0x000000,   // Pure black
            baseColor: 0x000000,       // Pure black
            blurFactor: 0.70,          // Lowered slightly to make the shapes more defined
            speed: 2.50,               // Increased speed so you can actually see it drifting
            zoom: 1.30
        })

        /* SAVE CONTACT */
        function downloadVCard() {
            // We join the lines with \r\n to ensure every phone recognizes the new line
            const vcardData = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "FN:Mily wayz",
                "TITLE:Music Artist",
                "EMAIL;TYPE=INTERNET,WORK:wezuduemoih@gmail.com",
                "TEL;TYPE=WORK,CELL,VOICE:+2348149595068",
                "URL:https://millise1.github.io/Mily_wayz_website/",
                "END:VCARD"
            ].join("\r\n");

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // Using a simple filename without spaces is safer for mobile downloads
            a.download = 'Mily_wayz.vcf';
            a.href = url;
            a.click();
            
            // Clean up
            setTimeout(() => window.URL.revokeObjectURL(url), 100);
        }

        /*SHARE PROFILE*/
        async function shareProfile() {
            const shareData = {
                title: document.title,
                text: 'Check out this professional profile!',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback for browsers that don't support Web Share API
                    await navigator.clipboard.writeText(window.location.href);
                    alert('Link copied to clipboard!');
                }
            } catch (err) {
                console.log('Error sharing:', err);
            }
        }
        /*AUTO-CHANGE-YEAR*/
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
