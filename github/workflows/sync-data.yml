name: Sync data.json to public

on:
  push:
    paths:
      - 'data.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Copy data.json to keystatic-admin/public
        run: cp data.json keystatic-admin/public/data.json
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystatic-admin/public/data.json
          git diff --staged --quiet || git commit -m "sync: update data.json in public"
          git push